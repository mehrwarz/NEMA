<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alexandria Three.js</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87a8c4;
    }

    canvas {
      display: block;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #111;
      color: white;
      font-family: sans-serif;
      z-index: 1000;
    }

    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font: 13px monospace;
      border-radius: 5px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div id="loading">
    Loading Alexandria...
  </div>

  <div id="info">
    Alexandria, Virginia
  </div>

  <script type="module" src="/src/main.js"></script>

</body>

</html>
