<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Traffic Signal Intersection</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #8eaabd;
        }

        canvas {
            display: block;
        }

        #panel {
            position: absolute;
            z-index: 10;
            top: 15px;
            left: 15px;
            width: 330px;
            padding: 15px;
            border-radius: 10px;
            color: #fff;
            background: rgba(12, 18, 23, 0.91);
            box-shadow: 0 8px 30px rgba(0, 0, 0, .35);
            backdrop-filter: blur(5px);
        }

        #panel h2 {
            margin: 0 0 10px;
            font-size: 18px;
        }

        #panel p {
            margin: 5px 0;
            font-size: 12px;
            line-height: 1.4;
        }

        textarea {
            width: 100%;
            height: 125px;
            margin-top: 10px;
            padding: 8px;
            box-sizing: border-box;
            resize: vertical;
            border: 1px solid #53616a;
            border-radius: 5px;
            background: #11181d;
            color: #d8f1ff;
            font-family: monospace;
            font-size: 12px;
        }

        button {
            margin-top: 8px;
            margin-right: 5px;
            padding: 7px 12px;
            border: 0;
            border-radius: 5px;
            background: #1976d2;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #2196f3;
        }

        #status {
            margin-top: 9px;
            color: #9be7a2;
            font: 11px monospace;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <div id="panel">
        <h2>Traffic Signal Intersection</h2>

        <p>
            <b>Main:</b> 3 lanes each direction<br>
            <b>Side:</b> 2 lanes each direction<br>
            <b>Traffic:</b> Right-hand traffic
        </p>

        <textarea id="signalInput">
            {
                "phases": {
                    "green": [2, 6],
                    "yellow": [],
                    "red": [3, 4, 7, 8],
                    "fly": [13, 15]
                }
            }
        </textarea>

        <button id="apply">Apply State</button>
        <button id="demo">Signal Demo</button>

        <div id="status">Ready</div>
    </div>


    <script type="importmap">
    {
        "imports": {
            "three": "./js/three.module.js",
            "three/addons/": "./js/jsm/"
        }
    }
    </script>

    <script type="module" src="./js/main.js"></script>

</body>

</html>
