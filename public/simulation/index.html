<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Traffic Intersection Simulation</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #91adbd;
            font-family: Arial, sans-serif
        }

        #app {
            width: 100%;
            height: 100%
        }

        #panel {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 10;
            width: min(430px, calc(100vw - 28px));
            padding: 12px;
            border-radius: 10px;
            background: rgba(15, 20, 22, .86);
            color: #fff;
            box-sizing: border-box;
            backdrop-filter: blur(7px);
            box-shadow: 0 8px 30px #0005
        }

        #panel textarea {
            width: 100%;
            height: 82px;
            box-sizing: border-box;
            margin: 7px 0;
            border-radius: 6px;
            border: 1px solid #555;
            background: #101416;
            color: #eee;
            padding: 8px;
            font: 12px monospace
        }

        #panel button {
            margin-right: 6px;
            padding: 7px 11px;
            border: 0;
            border-radius: 5px;
            cursor: pointer
        }

        .small {
            font-size: 11px;
            color: #aebdc3
        }

        #status {
            margin-top: 8px;
            font-size: 12px;
            color: #d7e6ec;
            line-height: 1.4
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <div id="panel"><b>Traffic Signal Control</b>
        <div class="small">Lane-aware intersection • dedicated and shared turn lanes</div>
        <textarea
            id="signalInput">{"phases":{"green":[2,6,11,12],"yellow":[],"red":[3,4,5,7,8,9,10,13,14,15,16],"fly":[13,15]}}</textarea>
        <button id="apply">Apply Signals</button><button id="demo">Signal Demo</button>
        <div id="status"></div>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "./src/lib/three.module.js",
            "three/addons/": "./src/lib/jsm/"
        }
    }
    </script>
    <script type="module" src="./src/main.js"></script>
</body>

</html>
